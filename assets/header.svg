<svg xmlns="http://www.w3.org/2000/svg" width="880" height="340" viewBox="0 0 880 340" role="img">
  <defs>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.2"/>
      <stop offset="30%" stop-color="#00f2fe" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="1"/>
      <stop offset="70%" stop-color="#10b981" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0.9"/>
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.5"/>
    </pattern>
  </defs>

  <style>
    @keyframes pulse {
      0%, 100% { opacity: 0.85; transform: scaleY(1); }
      50% { opacity: 0.4; transform: scaleY(0.7); }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }
    .mono { font-family: ui-monospace, SFMono-Regular, "Liberation Mono", Menlo, Consolas, monospace; }
    .pulse-dot { animation: blink 1.8s infinite; }
    .wave-bar { transform-origin: bottom; animation: pulse 2.2s infinite ease-in-out; }
  </style>

  <!-- Background Canvas -->
  <rect width="880" height="340" fill="#030712" rx="10"/>
  <rect width="880" height="340" fill="url(#grid)" rx="10"/>
  <rect width="880" height="340" fill="none" stroke="#1e293b" stroke-width="1.5" rx="10"/>

  <!-- Top Telemetry Header Bar -->
  <rect x="0" y="0" width="880" height="32" fill="#070d18" rx="10"/>
  <line x1="0" y1="32" x2="880" y2="32" stroke="#1e293b" stroke-width="1"/>

  <circle cx="20" cy="16" r="4.5" fill="#10b981" class="pulse-dot"/>
  <text x="32" y="20" class="mono" font-size="11" font-weight="600" fill="#f8fafc">h45sh</text>
  <text x="85" y="20" class="mono" font-size="11" fill="#475569">|</text>
  <text x="98" y="20" class="mono" font-size="11" fill="#38bdf8" font-weight="600">HIGH-VELOCITY SHIP ENGINE</text>
  <text x="285" y="20" class="mono" font-size="11" fill="#475569">|</text>
  <text x="298" y="20" class="mono" font-size="11" fill="#10b981">ZERO REGRESSION DEPLOYS</text>
  <text x="860" y="20" class="mono" font-size="11" fill="#64748b" text-anchor="end">github.com/h45sh</text>

  <!-- Speed Stream Waveform Strip -->
  <g transform="translate(20, 42)">
    <rect width="840" height="42" fill="#020617" rx="6" stroke="#1e293b" stroke-width="0.8"/>
    <!-- Simulated High-Throughput Frequency Spectrum -->
    <g fill="url(#waveGrad)">
      <rect x="15" y="16" width="3" height="20" class="wave-bar" style="animation-delay: 0.1s"/>
      <rect x="23" y="10" width="3" height="26" class="wave-bar" style="animation-delay: 0.3s"/>
      <rect x="31" y="6" width="3" height="30" class="wave-bar" style="animation-delay: 0.2s"/>
      <rect x="39" y="14" width="3" height="22" class="wave-bar" style="animation-delay: 0.5s"/>
      <rect x="47" y="18" width="3" height="18" class="wave-bar" style="animation-delay: 0.4s"/>
      <rect x="55" y="8" width="3" height="28" class="wave-bar" style="animation-delay: 0.7s"/>
      <rect x="63" y="12" width="3" height="24" class="wave-bar" style="animation-delay: 0.6s"/>
      <rect x="71" y="20" width="3" height="16" class="wave-bar" style="animation-delay: 0.2s"/>
      <rect x="79" y="5" width="3" height="31" class="wave-bar" style="animation-delay: 0.8s"/>
      <rect x="87" y="14" width="3" height="22" class="wave-bar" style="animation-delay: 0.1s"/>
      
      <!-- Center High-Frequency Stream -->
      <path d="M 110 21 Q 140 2 170 21 T 230 21 T 290 21 T 350 21 T 410 21 T 470 21 T 530 21 T 590 21 T 650 21 T 710 21 T 770 21" 
            fill="none" stroke="url(#waveGrad)" stroke-width="2.5" opacity="0.85"/>
      <path d="M 110 21 Q 130 35 150 21 T 190 21 T 230 21 T 270 21 T 310 21 T 350 21 T 390 21 T 430 21 T 470 21 T 510 21 T 550 21 T 590 21 T 630 21 T 670 21 T 710 21 T 750 21 T 790 21" 
            fill="none" stroke="#00f2fe" stroke-width="1.2" opacity="0.6"/>
      
      <rect x="800" y="8" width="3" height="28" class="wave-bar" style="animation-delay: 0.3s"/>
      <rect x="808" y="15" width="3" height="21" class="wave-bar" style="animation-delay: 0.7s"/>
      <rect x="816" y="12" width="3" height="24" class="wave-bar" style="animation-delay: 0.5s"/>
      <rect x="824" y="18" width="3" height="18" class="wave-bar" style="animation-delay: 0.2s"/>
    </g>
    <text x="420" y="25" class="mono" font-size="10" font-weight="700" fill="#e2e8f0" text-anchor="middle" letter-spacing="2">
      TUI STREAM VIRTUALIZATION: 10,000 LINES / SEC [60 FPS]
    </text>
  </g>

  <!-- Identity Block -->
  <text x="24" y="122" class="mono" font-size="24" font-weight="800" fill="#ffffff" letter-spacing="0.5">
    Harshwardhan P.
  </text>
  <text x="26" y="142" class="mono" font-size="12" font-weight="600" fill="#38bdf8">
    High-Velocity Systems &amp; AI Software Engineer
  </text>
  <text x="26" y="160" class="mono" font-size="11" fill="#94a3b8">
    Shipping production-grade agentic architectures, low-latency terminal workstations, and sub-second test gates.
  </text>

  <!-- High Velocity Telemetry Grid -->
  <!-- Box 1: Clarified Benchmark -->
  <g transform="translate(20, 180)">
    <rect width="268" height="64" fill="url(#boxGrad)" stroke="#1e293b" stroke-width="1" rx="6"/>
    <text x="14" y="22" class="mono" font-size="9.5" fill="#64748b" font-weight="600">TUI PERFORMANCE</text>
    <text x="14" y="42" class="mono" font-size="12.5" fill="#00f2fe" font-weight="700">Sub-ms Render Loops</text>
    <text x="14" y="55" class="mono" font-size="9" fill="#94a3b8">10k lines/sec stream virtualization</text>
  </g>

  <!-- Box 2 -->
  <g transform="translate(306, 180)">
    <rect width="268" height="64" fill="url(#boxGrad)" stroke="#1e293b" stroke-width="1" rx="6"/>
    <text x="14" y="22" class="mono" font-size="9.5" fill="#64748b" font-weight="600">TOKEN OPTIMIZATION</text>
    <text x="14" y="42" class="mono" font-size="12.5" fill="#10b981" font-weight="700">-75% LLM Context Bloat</text>
    <text x="14" y="55" class="mono" font-size="9" fill="#94a3b8">Zero-token targeted retrieval</text>
  </g>

  <!-- Box 3 -->
  <g transform="translate(592, 180)">
    <rect width="268" height="64" fill="url(#boxGrad)" stroke="#1e293b" stroke-width="1" rx="6"/>
    <text x="14" y="22" class="mono" font-size="9.5" fill="#64748b" font-weight="600">RAPID TEST HARNESS</text>
    <text x="14" y="42" class="mono" font-size="12.5" fill="#f59e0b" font-weight="700">&lt; 2s Pre-Commit Gate</text>
    <text x="14" y="55" class="mono" font-size="9" fill="#94a3b8">AST checks, pip-audit &amp; CodeQL</text>
  </g>

  <!-- Row 2 -->
  <!-- Box 4 -->
  <g transform="translate(20, 256)">
    <rect width="268" height="64" fill="url(#boxGrad)" stroke="#1e293b" stroke-width="1" rx="6"/>
    <text x="14" y="22" class="mono" font-size="9.5" fill="#64748b" font-weight="600">ARCHITECTURE &amp; DATA</text>
    <text x="14" y="42" class="mono" font-size="12" fill="#f8fafc" font-weight="700">Deterministic State</text>
    <text x="14" y="55" class="mono" font-size="9" fill="#94a3b8">O(1) SHA-256 entity graph lookups</text>
  </g>

  <!-- Box 5 -->
  <g transform="translate(306, 256)">
    <rect width="268" height="64" fill="url(#boxGrad)" stroke="#1e293b" stroke-width="1" rx="6"/>
    <text x="14" y="22" class="mono" font-size="9.5" fill="#64748b" font-weight="600">PRODUCTION RUNTIME</text>
    <text x="14" y="42" class="mono" font-size="12" fill="#f8fafc" font-weight="700">Python 3.11+ / Asyncio</text>
    <text x="14" y="55" class="mono" font-size="9" fill="#94a3b8">Non-blocking loops &amp; Linux daemons</text>
  </g>

  <!-- Box 6 -->
  <g transform="translate(592, 256)">
    <rect width="268" height="64" fill="url(#boxGrad)" stroke="#1e293b" stroke-width="1" rx="6"/>
    <text x="14" y="22" class="mono" font-size="9.5" fill="#64748b" font-weight="600">ACADEMICS</text>
    <text x="14" y="42" class="mono" font-size="12" fill="#f8fafc" font-weight="700">CS @ BITS Pilani</text>
    <text x="14" y="55" class="mono" font-size="9" fill="#94a3b8">Systems, OS &amp; Algorithm Analysis</text>
  </g>
</svg>
